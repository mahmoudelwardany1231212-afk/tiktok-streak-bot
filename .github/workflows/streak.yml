name: TikTok Streak Bot

on:
  schedule:
    - cron: '45 20 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run bot'
        required: false
        default: 'false'

jobs:
  run-streak-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 libxshmfence1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Decrypt credentials
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
        run: |
          echo "ENCRYPTION_PASSWORD=$ENCRYPTION_PASSWORD" >> $GITHUB_ENV

      - name: Run TikTok Streak Bot
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
          USER_A_CREDS: ${{ secrets.USER_A_CREDS }}
          USER_B_CREDS: ${{ secrets.USER_B_CREDS }}
        run: |
          python streak_bot.py

      - name: Commit and push updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "TikTok Streak Bot"
          git config --global user.email "bot@tiktok-streak.local"
          git add status.json config.json accounts/ -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update streak status [$(date +'%Y-%m-%d %H:%M')]"
            git push origin HEAD:main
          fi

      - name: Upload bot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: |
            status.json
            config.json
          retention-days: 7