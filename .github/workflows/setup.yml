name: Setup Accounts

on:
  workflow_dispatch:
    inputs:
      a_username:
        description: 'Account A - TikTok Username'
        required: true
      a_password:
        description: 'Account A - TikTok Password'
        required: true
      a_dash_pw:
        description: 'Account A - Dashboard Password (leave empty to skip)'
        required: false
        default: ''
      a_friend:
        description: 'Account A - Friend (Account B username)'
        required: true
      b_username:
        description: 'Account B - TikTok Username'
        required: true
      b_password:
        description: 'Account B - TikTok Password'
        required: true
      b_dash_pw:
        description: 'Account B - Dashboard Password (leave empty to skip)'
        required: false
        default: ''
      b_friend:
        description: 'Account B - Friend (Account A username)'
        required: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygithub cryptography

      - name: Encrypt and save credentials as GitHub Secrets
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
import os, json, base64, secrets as rng
from cryptography.fernet import Fernet
from cryptography.hazmat.primitives import hashes
from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
from github import Github

enc_pw = os.environ['ENCRYPTION_PASSWORD']
token = os.environ['GH_TOKEN']

def encrypt(text, password):
    salt = rng.token_bytes(16)
    kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=1000000)
    key = base64.urlsafe_b64encode(kdf.derive(password.encode()))
    f = Fernet(key)
    token_bytes = f.encrypt(text.encode())
    return base64.b64encode(salt + token_bytes).decode()

a_data = json.dumps({'username': '${{ inputs.a_username }}', 'password': '${{ inputs.a_password }}'})
b_data = json.dumps({'username': '${{ inputs.b_username }}', 'password': '${{ inputs.b_password }}'})

a_enc = encrypt(a_data, enc_pw)
b_enc = encrypt(b_data, enc_pw)

g = Github(token)
repo = g.get_repo('${{ github.repository }}')
repo.create_secret('USER_A_CREDS', a_enc)
repo.create_secret('USER_B_CREDS', b_enc)
print('Credentials encrypted and saved as GitHub Secrets!')
"

      - name: Update config.json
        run: |
          python -c "
import json
from werkzeug.security import generate_password_hash

config = {'accounts': {}}

a = {
    'tiktok_username': '${{ inputs.a_username }}',
    'bot_enabled': True,
    'messages_pool': ['🔥', '❤️', 'ستريك 🔥', '💪', '✅'],
    'send_mode': 'random',
    'custom_message': '',
    'friend_username': '${{ inputs.a_friend }}'
}
b = {
    'tiktok_username': '${{ inputs.b_username }}',
    'bot_enabled': True,
    'messages_pool': ['🌟', '🔥', '💯', 'عاش يا صاحبي', '✅'],
    'send_mode': 'random',
    'custom_message': '',
    'friend_username': '${{ inputs.b_friend }}'
}

pw_a = '${{ inputs.a_dash_pw }}'
pw_b = '${{ inputs.b_dash_pw }}'
if pw_a:
    a['dashboard_password_hash'] = generate_password_hash(pw_a)
if pw_b:
    b['dashboard_password_hash'] = generate_password_hash(pw_b)

config['accounts']['user_a'] = a
config['accounts']['user_b'] = b

with open('config.json', 'w') as f:
    json.dump(config, f, indent=2, ensure_ascii=False)
print('config.json updated!')
"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'

      - name: Commit config.json
        run: |
          git config --global user.name 'TikTok Streak Bot'
          git config --global user.email 'bot@tiktok-streak.local'
          git add config.json
          if git diff --staged --quiet; then
            echo 'No changes'
          else
            git commit -m 'Initial account setup'
            git push origin HEAD:main
          fi
